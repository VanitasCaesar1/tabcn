name: Menu Android

# Compiles react-native-tabcn-menu's Kotlin (the forked glass module) on every change to it, so a
# broken native build never reaches main. `bun run check` covers the JS; this covers the rest.

on:
  pull_request:
    paths:
      - packages/menu/**
      - apps/seek/**
      - .github/workflows/menu-android.yml
  push:
    branches: [main]
    paths:
      - packages/menu/**
      - apps/seek/**
      - .github/workflows/menu-android.yml

concurrency:
  group: menu-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile
      # Seek depends on the package, so its generated Android project links the module.
      - name: Prebuild Seek for Android
        working-directory: apps/seek
        run: bunx expo prebuild --platform android --no-install
      - name: Compile the glass module
        working-directory: apps/seek/android
        run: ./gradlew :react-native-tabcn-menu:compileReleaseKotlin --no-daemon --stacktrace
