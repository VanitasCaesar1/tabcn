name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Lets the release job start site.yml once a new version is on npm (see the last step).
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Releasing needs an npm token. Until the NPM_TOKEN secret is added, skip instead of failing
    # every push to main (changesets would otherwise try to publish the unpublished package).
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # Opens a "Version packages" PR from pending changesets; publishes to npm when that PR is merged.
      - uses: changesets/action@v1
        id: changesets
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's npm config reads the token from NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signs the published package with this workflow's identity (id-token: write above).
          NPM_CONFIG_PROVENANCE: true
      # site.yml also builds on this push, at the same moment as the publish, so it reads npm before
      # the new version is there. Once npm serves it, build the site again so the hero, the sidebar
      # and the Quick start show the version instead of "not on npm yet".
      - name: Rebuild the site with the new version
        if: steps.changesets.outputs.published == 'true'
        # Waits up to two minutes for the version just published (not merely any version) to show.
        run: |
          want=$(jq -r '.[] | select(.name == "react-native-tabcn") | .version' <<< "$PUBLISHED")
          for i in $(seq 1 12); do npm view "react-native-tabcn@${want:-latest}" version >/dev/null 2>&1 && break; sleep 10; done
          gh workflow run site.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
