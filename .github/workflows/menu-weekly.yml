name: Menu weekly

# Keeps react-native-tabcn-menu working against the dependencies it leans on: PanelUI (whose API
# and part defaults it copies), @expo/ui (the iOS menu), and the forked glass module on real
# Android versions. See docs/designs/menu.md, "Verification".
#
# - deps:    newest panelui-native and @expo/ui inside our ranges; typecheck and the menu tests.
# - android: Seek release build on API 33-36 emulators; maestro/menu.yaml asserts the glass ran.
# - ios:     Seek release build on a simulator; the same flow asserts Apple's menu ran.
# - report:  opens (or comments on) one issue labelled `menu-weekly` when any of those fail.
# - canary:  newest majors beyond our ranges. Informational: it never opens an issue.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 GMT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Newest panelui-native and @expo/ui inside our ranges
        run: for dir in packages/menu apps/seek apps/example; do (cd "$dir" && bun update panelui-native @expo/ui); done
      - run: bun run typecheck
      - run: bun run --cwd packages/menu test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile
      - run: for dir in packages/menu apps/seek apps/example; do (cd "$dir" && bun update panelui-native @expo/ui); done
      - name: Build Seek (release, bundled JS)
        working-directory: apps/seek
        run: |
          bunx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the menu flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install apps/seek/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/seek/maestro/menu.yaml -e RENDERER=glass --test-output-dir maestro-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-android-${{ matrix.api-level }}
          path: maestro-out
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: for dir in packages/menu apps/seek apps/example; do (cd "$dir" && bun update panelui-native @expo/ui); done
      - name: Build Seek for the simulator (release, bundled JS)
        working-directory: apps/seek
        run: |
          bunx expo prebuild --platform ios
          xcodebuild -workspace ios/Seek.xcworkspace -scheme Seek -configuration Release \
            -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO | tail -20
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the menu flow
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" apps/seek/ios/build/Build/Products/Release-iphonesimulator/Seek.app
          maestro --device "$DEVICE" test apps/seek/maestro/menu.yaml -e RENDERER=system --test-output-dir maestro-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-ios
          path: maestro-out
          if-no-files-found: ignore

  report:
    needs: [deps, android, ios]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the menu-weekly issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create menu-weekly --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "react-native-tabcn-menu weekly check" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label menu-weekly --state open --json number --jq '.[0].number')
          BODY="The weekly react-native-tabcn-menu check failed: $RUN_URL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label menu-weekly \
              --title "Menu weekly check failed" --body "$BODY"
          fi

  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Newest majors, beyond our ranges
        run: for dir in packages/menu apps/seek apps/example; do (cd "$dir" && bun update --latest panelui-native @expo/ui); done
      - run: bun run typecheck
      - run: bun run --cwd packages/menu test
